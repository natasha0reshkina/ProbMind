name: probmind

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-probmind}
      POSTGRES_USER: ${POSTGRES_USER:-probmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-probmind_local}
    volumes:
      - probmind_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-probmind} -d ${POSTGRES_DB:-probmind}"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-probmind};Username=${POSTGRES_USER:-probmind};Password=${POSTGRES_PASSWORD:-probmind_local}
      ConnectionStrings__Redis: redis:6379
      Jwt__Issuer: ProbMind
      Jwt__Audience: ProbMind.Web
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-probmind-local-development-signing-key-2026-change-for-production}
      Jwt__AccessTokenMinutes: 20
      Jwt__RefreshTokenDays: 30
    ports:
      - "${API_PORT:-8010}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 4s
      retries: 30

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-probmind};Username=${POSTGRES_USER:-probmind};Password=${POSTGRES_PASSWORD:-probmind_local}
      ConnectionStrings__Redis: redis:6379
      Jwt__Issuer: ProbMind
      Jwt__Audience: ProbMind.Web
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-probmind-local-development-signing-key-2026-change-for-production}
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  tests:
    profiles: ["check"]
    build:
      context: ./backend
      dockerfile: Dockerfile.tests
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-probmind};Username=${POSTGRES_USER:-probmind};Password=${POSTGRES_PASSWORD:-probmind_local}
      ConnectionStrings__Redis: redis:6379
      Jwt__Issuer: ProbMind
      Jwt__Audience: ProbMind.Web
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-probmind-local-development-signing-key-2026-change-for-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  probmind_postgres:
